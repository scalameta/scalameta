name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This file names no Scala version (all listed in project/Versions.scala).
# `sbt alias` lists what CI can ask for.

# Pre-merge gate (pr-* jobs): only the most critical checks, packed into a
# few equal-length workers so it finishes about as fast as the work allows.
# No event guard, so they run post-merge too, where the post-* jobs
# (if: push) add everything else — one definition, no drift.

jobs:
  post-jvm-other-jdks:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - &jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java || '17' }}
          distribution: 'temurin'
          cache: 'sbt'
      - &sbt
        uses: sbt/setup-sbt@v1
        with:
          # a restored disk cache hung sbt before its first task
          disk-cache: false
      # a cold boot downloads sbt and Scala; that failing is not a test failing
      - &sbt_bootup
        name: start the sbt server
        run: sbt whoami
        shell: bash
      - &testjvm212
        if: ${{ !cancelled() }}
        run: sbt tests2_12_latest
      - &testsem212
        if: ${{ !cancelled() }}
        run: sbt testsSemanticdb2_12_latest
      - &testjvm213
        if: ${{ !cancelled() }}
        run: sbt tests2_13_latest
      - &testsem213
        if: ${{ !cancelled() }}
        run: sbt testsSemanticdb2_13_latest
      - &testjvm3lts
        if: ${{ !cancelled() }}
        run: sbt tests3_lts/testFull
      - &testjvm3next
        if: ${{ !cancelled() }}
        run: sbt tests3_next/testFull

  # ===== PR gate: 5 balanced JDK-17 workers, run on PR *and* push (~8 min) =====
  pr-jvm212-sem212-js38: # 2.12 parser and mima + semanticdb + latest-3 JS
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *testjvm212
      - if: ${{ !cancelled() }}
        run: sbt mima2_12
      - *testsem212
      - if: ${{ !cancelled() }}
        run: sbt testsJS3_next/testFull

  pr-jvm213-js33-other: # 2.13 parser and mima + 3.3 JS + scala-library download
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *testjvm213
      - if: ${{ !cancelled() }}
        run: sbt mima2_13
      - if: ${{ !cancelled() }}
        run: sbt testsJS3_lts/testFull
      - if: ${{ !cancelled() }}
        run: sbt download-scala-library
      # the shortest worker of the gate, and it already builds the 2.13 rows scaladoc documents
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sbt doc
  
  pr-jvm33-sem213-other: # 3.3 parser and mima + 2.13 semanticdb + community + scalafmt
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *testjvm3lts
      - if: ${{ !cancelled() }}
        run: sbt mima3_lts
      - *testsem213
      - if: ${{ !cancelled() }}
        run: sbt communitytest/testFull
      - if: ${{ !cancelled() }}
        run: ./bin/scalafmt --test

  pr-jvm38-js2: # latest-3 parser + JS on both Scala 2 lines
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *testjvm3next
      - if: ${{ !cancelled() }}
        run: sbt testsJS2_12/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsJS/testFull

  # ===== post-merge superset: deferred axes, added only on push to main =====
  post-native: # flaky Native leg — deferred off the PR gate, retried once
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Scala Native's trap-based GC yieldpoints intermittently time out on CI.
    env:
      SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS: '0'
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *sbt_bootup
      - if: ${{ !cancelled() }}
        run: sbt testsNative2_12/testFull || sbt testsNative2_12/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsNative/testFull || sbt testsNative/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsNative3_lts/testFull || sbt testsNative3_lts/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsNative3_next/testFull || sbt testsNative3_next/testFull

  post-other-scala: # what the gate leaves out: an older 2.x patch, a further Scala 3 row
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binary: [ '2_13', '2_12', '3' ]
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *sbt_bootup
      - if: ${{ !cancelled() }}
        run: sbt tests${{ matrix.binary }}_other
      - if: ${{ !cancelled() && startsWith(matrix.binary, '2_') }} # semanticdb is Scala 2 only
        run: sbt testsSemanticdb${{ matrix.binary }}_other

  post-windows: # Windows parser/JS/semanticdb (line-ending sensitivity)
    if: ${{ github.event_name == 'push' }}
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - *jdk
      - *sbt
      - *sbt_bootup
      - if: ${{ !cancelled() }}
        run: sbt tests/testFull
        shell: bash
      - if: ${{ !cancelled() }}
        run: sbt testsJS/testFull
        shell: bash
      - if: ${{ !cancelled() }}
        run: sbt testsSemanticdb/testFull
        shell: bash
