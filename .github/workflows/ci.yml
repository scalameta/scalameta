name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This file names no Scala version (all listed in project/Versions.scala).
# `sbt alias` lists what CI can ask for.

# Pre-merge gate (pr-* jobs): only the most critical checks, packed into a
# few equal-length workers so it finishes about as fast as the work allows.
# No event guard, so they run post-merge too, where the post-* jobs
# (if: push) add everything else — one definition, no drift.

jobs:
  post-jvm-other-jdks:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # without this, GitHub holds a hung job for six hours
    timeout-minutes: &timeout 45
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - &jdk
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java || '17' }}
          distribution: 'temurin'
          cache: 'sbt'
      - &sbt
        uses: sbt/setup-sbt@v1
        with:
          # a restored disk cache hung sbt before its first task
          disk-cache: false
      # a cold boot downloads sbt and Scala; that failing is not a test failing
      - &sbt_bootup
        name: start the sbt server
        # the client can read a half-written active.json; a second one reaches the same server
        run: sbt whoami || sbt whoami
        shell: bash
      - &testjvm212
        if: ${{ !cancelled() }}
        run: sbt tests2_12/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsSemanticdb2_12_latest
      - &testjvm213
        if: ${{ !cancelled() }}
        run: sbt tests2_13/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsSemanticdb2_13_latest
      - &testjvm3lts
        if: ${{ !cancelled() }}
        run: sbt tests3_lts/testFull
      - &testjvm3next
        if: ${{ !cancelled() }}
        run: sbt tests3_next/testFull
      - &testsymtab3lts
        if: ${{ !cancelled() }}
        run: sbt testsSemanticdbSymtab3_lts/testFull
      - &testsymtab3next
        if: ${{ !cancelled() }}
        run: sbt testsSemanticdbSymtab3_next/testFull

  # ===== PR gate: 4 balanced JDK-17 workers, run on PR *and* push (~12 min) =====
  pr-jvm212-sem212-js3N: # 2.12 parser, mima, semanticdb; 3next JS
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *sbt_bootup
      - *testjvm212
      - if: ${{ !cancelled() }}
        run: sbt mima2_12
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sbt doc2_12
      - &testsem212
        if: ${{ !cancelled() }}
        run: sbt testsSemanticdb2_12
      - if: ${{ !cancelled() }}
        run: sbt testsJS3_next/testFull

  pr-jvm213-js3L-other: # 2.13 parser, mima, community; 3lts JS; scala-library download
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *sbt_bootup
      - *testjvm213
      - if: ${{ !cancelled() }}
        run: sbt mima2_13
      - if: ${{ !cancelled() }}
        run: sbt communitytest/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsJS3_lts/testFull
      - if: ${{ !cancelled() }}
        run: sbt download-scala-library
      # the tests run in the server JVM, which reads line.separator once at start
      - &sbt_crlf
        if: ${{ !cancelled() }}
        name: restart the sbt server with CRLF line endings
        run: |
          sbt shutdown
          sbt $'-J-Dline.separator=\r\n' whoami || sbt $'-J-Dline.separator=\r\n' whoami
          sbt 'eval assert(System.lineSeparator == "\r\n")'
        shell: bash
      # each step carries the option: a client that misses the server starts its own
      - if: ${{ !cancelled() }}
        run: sbt $'-J-Dline.separator=\r\n' tests2_13/testFull
        shell: bash
  
  pr-jvm3L-sem213-other: # 3lts parser, mima, semanticdb-dotc; 2.13 semanticdb; scalafmt; 3 symtab
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *sbt_bootup
      - *testjvm3lts
      - if: ${{ !cancelled() }}
        run: sbt mima3_lts
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sbt doc3_lts
      - &testsem213
        if: ${{ !cancelled() }}
        run: sbt testsSemanticdb2_13
      - if: ${{ !cancelled() }}
        run: ./bin/scalafmt --test
      - *testsymtab3lts
      - *testsymtab3next
      - *sbt_crlf
      - if: ${{ !cancelled() }}
        run: sbt $'-J-Dline.separator=\r\n' testsSemanticdb2_13
        shell: bash
      - if: ${{ !cancelled() }}
        run: sbt $'-J-Dline.separator=\r\n' semanticdbDotc3_lts/testFull
        shell: bash

  pr-jvm3N-js2: # 3next parser, semanticdb-dotc; 2.x JS
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *sbt_bootup
      - *testjvm3next
      - if: ${{ !cancelled() }}
        run: sbt semanticdbDotc3_next/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsJS2_12/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsJS2_13/testFull
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sbt docJS2_13

  # ===== post-merge superset: deferred axes, added only on push to main =====
  post-native: # flaky Native leg — deferred off the PR gate, retried once
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    # Scala Native's trap-based GC yieldpoints intermittently time out on CI.
    env:
      SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS: '0'
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *sbt_bootup
      - if: ${{ !cancelled() }}
        run: sbt testsNative2_12/testFull || sbt testsNative2_12/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsNative2_13/testFull || sbt testsNative2_13/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsNative3_lts/testFull || sbt testsNative3_lts/testFull
      - if: ${{ !cancelled() }}
        run: sbt testsNative3_next/testFull || sbt testsNative3_next/testFull
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        run: sbt docNative3_lts

  post-other-scala: # what the gate leaves out: an older 2.x patch, a further Scala 3 row
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: *timeout
    strategy:
      fail-fast: false
      matrix:
        binary: [ '2_13', '2_12', '3' ]
    steps:
      - *checkout
      - *jdk
      - *sbt
      - *sbt_bootup
      - if: ${{ !cancelled() }}
        run: sbt tests${{ matrix.binary }}_other
      - if: ${{ !cancelled() && startsWith(matrix.binary, '2_') }} # semanticdb is Scala 2 only
        run: sbt testsSemanticdb${{ matrix.binary }}_other
      - if: ${{ !cancelled() && matrix.binary == '3' }} # semanticdb-dotc is Scala 3 only
        run: sbt semanticdbDotc3_other
      - if: ${{ !cancelled() && matrix.binary == '3' }}
        run: sbt testsSemanticdbSymtab3_other

  post-windows: # Windows parser/JS/semanticdb (line-ending sensitivity)
    if: ${{ github.event_name == 'push' }}
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: *timeout
    steps:
      - uses: actions/checkout@v7
      - *jdk
      - *sbt
      - *sbt_bootup
      - if: ${{ !cancelled() }}
        run: sbt tests2_13/testFull
        shell: bash
      - if: ${{ !cancelled() }}
        run: sbt testsJS2_13/testFull
        shell: bash
      - if: ${{ !cancelled() }}
        run: sbt testsSemanticdb2_13
        shell: bash
